[workspace]
members = [
    "programs/*"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1


[package]
name = "workspace-tests"
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = "1.0.2"


[[test]]
name = "escrow_test"
path = "tests/escrow_test.rs"


[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed", "idl-build"] }
anchor-spl = { version = "1.0.2", features = ["idl-build"] }
escrow_1 = { path = "programs/escrow_1" ,features = ["no-entrypoint"]}

[dev-dependencies]
anchor-litesvm = "0.4.0"
litesvm = "0.12.0"
litesvm-token = "0.12.0"
litesvm-utils = "0.4.0"

solana-sdk = "4.0.1"

spl-associated-token-account = "8.0.0"
spl-token = "9.0.0"